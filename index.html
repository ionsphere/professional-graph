<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Professional Graph Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="sessions.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Professional Graph</p>
        <h1>Your world of work</h1>
      </div>
      <div class="top-actions">
        <div class="legend" aria-label="Graph legend">
          <span><i class="legend-dot muted"></i> weaker match</span>
          <span><i class="legend-dot active"></i> stronger match</span>
          <span><i class="legend-ring"></i> affected by this answer</span>
        </div>
        <div class="session-actions">
          <button id="historyButton" class="quiet-button" type="button">Sessions</button>
          <button id="shareButton" class="quiet-button" type="button">Share</button>
          <button id="newSessionButton" class="primary-button" type="button" hidden>New session</button>
        </div>
      </div>
    </header>

    <section class="graph-card" aria-label="Interactive profession graph">
      <canvas id="graphCanvas"></canvas>
      <div class="graph-controls">
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="fitView" type="button">Fit</button>
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
      </div>
      <div id="nodeTooltip" class="tooltip" hidden></div>
    </section>

    <section class="assessment-card">
      <div class="progress-row">
        <strong id="progressLabel">0 of 100 answered</strong>
        <span id="progressPercent">Viewing 1</span>
      </div>
      <div class="question-slider-wrap">
        <input id="questionSlider" class="question-slider" type="range" min="1" max="100" value="1" step="1" aria-label="Question navigation" />
        <div class="slider-scale" aria-hidden="true"><span>1</span><span>100</span></div>
      </div>

      <div class="question-copy">
        <p class="question-index" id="questionIndex">Question 1</p>
        <h2 id="questionText"></h2>
      </div>

      <div id="answerButtons" class="answers" role="group" aria-label="Answer choices"></div>
      <p class="interaction-note">Progress is saved after every answer. One finger pans, two fingers pinch to zoom, and double-tap zooms in.</p>
    </section>
  </main>

  <dialog id="sessionsDialog" class="sessions-dialog">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">Saved locally</p>
        <h2>Answer sessions</h2>
      </div>
      <button id="closeSessionsButton" class="icon-button" type="button" aria-label="Close">×</button>
    </div>
    <div id="sessionsList" class="sessions-list"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="model.js"></script>
  <script src="question-ids.js"></script>
  <script src="session-store.js"></script>
  <script src="app.js"></script>
</body>
</html>
